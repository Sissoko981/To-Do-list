<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do-To List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="/assets/image/Logo.jpeg" alt="SONATEL" >
        <h1>Mon To-Do List</h1>
        <p>Planification de mes cours</p>
    </header>
    <main>
        <section class="objectif-box">

            <div class="form-tache">

            <input type="text" id="nouvelle-tache" placeholder="Ajout de nouvelle tâche?">

            <button id="ajouter-btn">Ajouter</button>
            </div>
            <ul id="liste-taches">
            </ul>
        
 
        </section>

        
    </main>

    <footer>
            <p>&copy; To-Do List. Tous droits réservés.</p>
    </footer>
    <script src="/script.js"></script>
</body>
</html>
